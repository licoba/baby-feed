<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宝宝吃奶</title><style>body{margin:0;background:#fff8f2;color:#3a2a25;font-family:Arial,sans-serif;text-align:center}main{padding:18px 14px}.date{color:#9b8176;font-size:16px}.age{color:#b46d52;margin:8px}.clock{font-size:48px;margin:16px 0}.btn{width:100%;padding:18px 0;border:0;border-radius:20px;background:#f28b66;color:#fff;font-size:24px}.btn:disabled{background:#d8beb3}.card{margin-top:16px;padding:16px;border-radius:18px;background:#fff0e8;font-size:16px}.card #elapsed{font-size:16px;font-weight:400;color:#7d5b4c;margin-top:6px}.card #elapsed b{font-size:36px}.history{text-align:left;background:#fff;border-radius:18px;padding:16px;margin-top:16px}.row{border-bottom:1px solid #f5e9e2;padding:10px 0}.small{color:#b29b91;font-size:12px}@media (orientation:landscape){main{position:relative;text-align:left;padding:12px 20px;min-height:100vh;box-sizing:border-box}.date,.age,.clock,.btn,.card,#hint{width:48%;box-sizing:border-box}.date,.age{text-align:left}.clock{font-size:42px;margin:10px 0}.btn{display:block;text-align:center}.card{margin-top:12px}.history{position:absolute;right:20px;top:12px;width:46%;height:calc(100vh - 24px);box-sizing:border-box;overflow:hidden;margin:0}.history #list{height:calc(100% - 35px);overflow:auto;scrollbar-width:none}.history #list::-webkit-scrollbar{display:none}.small{font-size:11px}}
</style></head><body><main><div class="date" id="date"></div><div class="age" id="age"></div><div class="clock" id="clock"></div><button class="btn" id="record">刚吃完奶</button><div class="small" id="hint" style="display:none"></div><div class="card"><b id="status">距离上次吃奶</b><div id="elapsed">暂无记录</div></div><div class="history"><b>吃奶历史</b><div id="list">加载中…</div></div></main><script>(function(){var fam='default-family',feedings=[];function pad(n){return n<10?'0'+n:n}function fmt(s){var d=new Date(s);return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}function day(n){var b=new Date(2026,8,21),d=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.floor((d-b)/86400000)+1}function draw(){var n=new Date(),last=feedings[0]?new Date(feedings[0]):null;document.getElementById('date').innerHTML=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日（第'+day(n)+'天）';document.getElementById('age').innerHTML='';document.getElementById('clock').innerHTML=fmt(n);var m=last?Math.floor((n-last)/60000):30,ok=!last||m>=30;document.getElementById('record').disabled=!ok;document.getElementById('hint').innerHTML=ok?'点击记录当前时间':'';document.getElementById('status').innerHTML=last&&m>=90?'可以冲奶了！':'距离上次吃奶';document.getElementById('elapsed').innerHTML=last?'<b>'+Math.floor(m/60)+'</b> 小时 <b>'+(m%60)+'</b> 分钟':'暂无记录';var h='';for(var i=0;i<feedings.length;i++){var em=i===0?null:Math.floor((new Date(feedings[i-1])-new Date(feedings[i]))/60000);h+='<div class="row"><b>'+fmt(feedings[i])+'</b><div class="small">'+new Date(feedings[i]).toLocaleDateString()+'　'+(i===0?'最近一次':'+'+Math.floor(em/60)+' 小时 '+(em%60)+' 分钟')+'</div></div>'}document.getElementById('list').innerHTML=h||'还没有记录'}function load(){var x=new XMLHttpRequest();x.open('GET','/api/feedings?family='+fam,true);x.onreadystatechange=function(){if(x.readyState==4&&x.status==200){try{feedings=JSON.parse(x.responseText).feedings||[];draw()}catch(e){}}};x.send()}document.getElementById('record').onclick=function(){var n=new Date().toISOString(),x=new XMLHttpRequest();x.open('POST','/api/feedings',true);x.setRequestHeader('Content-Type','application/json');x.send(JSON.stringify({family:fam,at:n}));feedings.unshift(n);draw();setTimeout(load,800)};draw();load();setInterval(load,10000);setInterval(draw,1000)})()</script></body></html>
